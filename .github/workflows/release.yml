name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag vMAJOR.MINOR.PATCH (already on the remote). Example: v0.1.1'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      # Tag push: this YAML is the copy in the tagged commit.
      # Dispatch: Use workflow from main, then checkout the tag.
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag matches ModuleVersion
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$TAG' must be vMAJOR.MINOR.PATCH (example: v0.1.1)"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Packing tag $TAG at $HEAD_SHA"
          MODVER=$(sed -n "s/.*ModuleVersion[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" src/Zapman/Zapman.psd1 | head -n1 | tr -d ' \r\n')
          VERSION="v${MODVER}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: tag '$TAG' does not match ModuleVersion in src/Zapman/Zapman.psd1 ('$VERSION')"
            exit 1
          fi

      - name: Notes from CHANGELOG
        run: |
          set -euo pipefail
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "($|[ \t-])" { p=1; next }
            p && $0 ~ /^## / { exit }
            p { print }
          ' CHANGELOG.md | sed 's/\r$//' > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '%s\n' "No CHANGELOG section for $TAG." > release-notes.md
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar rar

      - name: Prepare release bundle
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          mkdir "$NAME"
          cp zapman.bat cli.bat README.md LICENSE.txt CHANGELOG.md "$NAME/"
          cp -r bin lists strategies src docs "$NAME/"

      - name: Create archives
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          zip -qr "${NAME}.zip" "$NAME"
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Print SHA256 checksums
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          sha256sum \
            "${NAME}.zip" \
            "${NAME}.rar" \
            "${NAME}.tar.gz"

      # Draft until someone clicks Publish. Published releases in this repo are immutable.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Assets are not replaced."
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${NAME}.zip" \
            "${NAME}.rar" \
            "${NAME}.tar.gz"
