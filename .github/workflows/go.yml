name: Go

on:
  push:
    branches: [main, go]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # Lint tools have their own module, so their dependencies do not mix with ours.
      # Also checks gofmt and goimports (formatters in .golangci.yml).
      - name: Lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

      - name: Vulnerabilities
        run: go tool -modfile=tools/go.mod govulncheck ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
