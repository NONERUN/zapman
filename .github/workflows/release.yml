name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag with v prefix (must match ModuleVersion in src/Zapman/Zapman.psd1, e.g. v0.1.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches ModuleVersion
        run: |
          set -euo pipefail
          TAG='${{ github.event.inputs.tag }}'
          MODVER=$(sed -n "s/.*ModuleVersion[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" src/Zapman/Zapman.psd1 | head -n1 | tr -d ' \r\n')
          VERSION="v${MODVER}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$TAG' must be vMAJOR.MINOR.PATCH (example: v0.1.0)"
            exit 1
          fi
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: tag '$TAG' does not match ModuleVersion in src/Zapman/Zapman.psd1 ('$VERSION')"
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar rar

      - name: Prepare release bundle
        run: |
          set -euo pipefail
          NAME="zapman-${{ github.event.inputs.tag }}"
          mkdir "$NAME"
          cp zapman.bat cli.bat README.md LICENSE.txt CHANGELOG.md "$NAME/"
          cp -r bin lists strategies src docs "$NAME/"

      - name: Create archives
        run: |
          set -euo pipefail
          NAME="zapman-${{ github.event.inputs.tag }}"
          zip -qr "${NAME}.zip" "$NAME"
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Print SHA256 checksums
        run: |
          set -euo pipefail
          NAME="zapman-${{ github.event.inputs.tag }}"
          sha256sum \
            "${NAME}.zip" \
            "${NAME}.rar" \
            "${NAME}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            zapman-${{ github.event.inputs.tag }}.zip
            zapman-${{ github.event.inputs.tag }}.rar
            zapman-${{ github.event.inputs.tag }}.tar.gz
