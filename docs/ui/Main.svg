  </g>
  <rect x="24" y="446" width="368" height="92" fill="#f7f7f7" stroke="#b5b5b5"/>
  <text x="34" y="460" font-size="11" text-anchor="start" font-weight="bold" fill="#222">Tools</text>
  <g>
    <title>Скачать ipset-all.txt из репозитория.</title>
  <rect x="40" y="472" width="168" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="124" y="490" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Скачать ipset</text>
  </g>
  <g>
    <title>Сравнить hosts Windows с копией из репозитория. При расхождении можно скопировать шаблон или открыть hosts в Блокноте.</title>
  <rect x="216" y="472" width="168" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="300" y="490" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Сверить hosts</text>
  </g>
  <g>
    <title>Сравнить тег этой сборки с тегами GitHub. Архив сами не скачивает.</title>
  <rect x="40" y="506" width="168" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="124" y="524" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Проверить версию</text>
  </g>
  <g>
    <title>Конфликты, путь, DNS, WinDivert и кэш Discord.</title>
  <rect x="216" y="506" width="168" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="300" y="524" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Диагностика</text>
