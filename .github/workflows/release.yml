name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag vMAJOR.MINOR.PATCH (already on the remote). Example: v0.1.1'
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # zapman.exe is a Windows GUI (Wails v3). The frontend is embedded with
  # go:embed, so "go build" is enough: no wails3 CLI, no npm.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      # Tag push: this YAML is the copy in the tagged commit.
      # Dispatch: Use workflow from main, then checkout the tag.
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tag is the product version. No file in the repo has it.
      - name: Verify tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$TAG' must be vMAJOR.MINOR.PATCH (example: v0.1.1)"
            exit 1
          fi
          echo "Building tag $TAG at $(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Test
        run: go test ./...

      # Only the file and product version change; the manifest, the icon and
      # the strings come from winres.json. The committed .syso has 0.0.0.0.
      - name: Version info
        working-directory: cmd/zapman
        run: |
          set -euo pipefail
          go tool -modfile=../../tools/go.mod go-winres make --in winres.json --arch amd64 --out rsrc \
            --file-version "${TAG#v}" --product-version "${TAG#v}"

      # -tags production: no WebView2 devtools, no dev server URL from the
      # environment, no debug log (Wails v3 Taskfile does the same).
      # -H windowsgui: no console window.
      # -X sets app.Version, which BuildVersion gives before the build info.
      - name: Build zapman.exe
        run: |
          set -euo pipefail
          go build -tags production -trimpath \
            -ldflags "-s -w -H windowsgui -X github.com/NONERUN/zapman/internal/app.Version=${TAG}" \
            -o zapman.exe ./cmd/zapman
          sha256sum zapman.exe

      - name: Upload zapman.exe
        uses: actions/upload-artifact@v4
        with:
          name: zapman-exe
          path: zapman.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download zapman.exe
        uses: actions/download-artifact@v4
        with:
          name: zapman-exe

      - name: Notes from CHANGELOG
        run: |
          set -euo pipefail
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "($|[ \t-])" { p=1; next }
            p && $0 ~ /^## / { exit }
            p { print }
          ' CHANGELOG.md | sed 's/\r$//' > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '%s\n' "No CHANGELOG section for $TAG." > release-notes.md
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar rar

      # zapman.exe needs bin/, strategies/ and lists/ next to it; it makes
      # user/ and test-results/ itself. The icon is in the exe; its license
      # goes with the archive. docs/dev.md is for developers: it is not in
      # the archive (README.md links to it on GitHub). dev/dist makes the same
      # bundle on a local computer: change its file list together with this.
      - name: Prepare release bundle
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          mkdir -p "$NAME/assets"
          cp zapman.exe README.md LICENSE.txt CHANGELOG.md "$NAME/"
          cp assets/app.LICENSE.txt "$NAME/assets/"
          cp -r bin lists strategies docs "$NAME/"
          rm "$NAME/docs/dev.md"

      - name: Create archives
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          zip -qr "${NAME}.zip" "$NAME"
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Print SHA256 checksums
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          sha256sum \
            "$NAME/zapman.exe" \
            "${NAME}.zip" \
            "${NAME}.rar" \
            "${NAME}.tar.gz"

      # Draft until someone clicks Publish. Published releases in this repo are immutable.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="zapman-${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Assets are not replaced."
            gh release view "$TAG"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${NAME}.zip" \
            "${NAME}.rar" \
            "${NAME}.tar.gz"
