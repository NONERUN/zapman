name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  powershell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Lint PowerShell
        shell: pwsh
        run: |
          & ./utils/lint.ps1
