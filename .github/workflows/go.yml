name: Go

on:
  push:
    branches: [main, go]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Also checks gofmt and goimports (formatters in .golangci.yml).
      - name: Lint
        run: go tool golangci-lint run ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
