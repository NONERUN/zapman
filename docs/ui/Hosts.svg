<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436" height="228" viewBox="0 0 436 228" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="436" height="228" fill="#f0f0f0" stroke="#6d6d6d"/>
  <rect x="0" y="0" width="436" height="28" fill="#fff" stroke="#c8c8c8"/>
  <text x="10" y="18" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Сверить hosts</text>
  <text x="20" y="56" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Файл hosts нужно обновить. Скопируйте шаблон, откройте hosts, вставьте блок в конец (или замените прежний) и сохраните.</text>
  <g>
    <title>Скопировать блок hosts из репозитория в буфер.</title>
  <rect x="20" y="124" width="190" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="115" y="142" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Копировать шаблон</text>
  </g>
  <g>
    <title>Открыть системный hosts в Блокноте. Можно сохранить: приложение уже с правами администратора.</title>
  <rect x="226" y="124" width="190" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="321" y="142" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Открыть hosts</text>
  </g>
  <g>
  <rect x="333" y="182" width="83" height="28" fill="#e1e1e1" stroke="#adadad"/>
  <text x="374" y="200" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">Закрыть</text>
  </g>
</svg>
