<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="416" height="604" viewBox="0 0 416 604" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="416" height="604" fill="#f0f0f0" stroke="#6d6d6d"/>
